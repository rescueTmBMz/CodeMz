<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cobertura nacional — Celinka Survey</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400..600&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#F2EEE8;font-family:'IBM Plex Sans',system-ui,sans-serif}
  #map{position:absolute;inset:0}
  .leaflet-container{background:#DDE6EC;font-family:'IBM Plex Sans',system-ui,sans-serif}
  .leaflet-popup-content-wrapper{border-radius:2px;box-shadow:0 10px 30px rgba(8,25,42,.22)}
  .leaflet-popup-content{margin:16px 18px;font-size:14px;line-height:1.5;color:#0C2237}
  .pop-name{font-family:'Source Serif 4',Georgia,serif;font-size:21px;font-weight:600;margin-bottom:6px}
  .pop-meta{color:#5B6B7A;font-size:13px}
  .pop-tag{display:inline-block;margin-top:10px;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#1E9E58;border:1px solid #B9E0CB;padding:5px 9px}
  .legend{position:absolute;left:16px;bottom:22px;z-index:500;background:rgba(250,248,245,.95);border:1px solid #E3DED6;padding:14px 16px;font-size:12px;color:#0C2237;max-width:240px}
  .legend b{display:block;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#5B6B7A;margin-bottom:9px}
  .legend .row{display:flex;align-items:center;gap:9px;margin-top:7px;line-height:1.35}
  .dot{width:12px;height:12px;border-radius:50%;background:#1E9E58;border:2px solid #fff;box-shadow:0 0 0 1px rgba(12,34,55,.25);flex-shrink:0}
  .dot.hq{background:#14559C}
</style>
</head>
<body>
<div id="map"></div>
<div class="legend">
  <b>Cobertura nacional</b>
  <div class="row"><span class="dot hq"></span> Sede — Maputo</div>
  <div class="row"><span class="dot"></span> Província com operações de recolha de dados</div>
  <div class="row" style="color:#5B6B7A;margin-top:10px">Clique numa província para ver a actividade.</div>
</div>
<script>
  var PROVINCES = [
    ["Cidade de Maputo", -25.966, 32.583, "Sede · Av. Julius Nyerere 562, Polana Cimento", "Sede nacional", true],
    ["Maputo Província", -25.545, 32.301, "Índice de Satisfação do Cidadão · inquéritos socioeconómicos", "7.000 AF a nível nacional", false],
    ["Gaza", -23.862, 33.529, "Inquéritos socioeconómicos e de saúde pública", "Cobertura activa", false],
    ["Inhambane", -23.865, 35.383, "Estudo qualitativo DHIS2 e Salama · distribuição de redes", "MISAU / PNCM (CHAI)", false],
    ["Sofala", -19.843, 34.839, "Campanha de Cobertura Universal de redes tratadas", "+3.100 AF entrevistados", false],
    ["Manica", -19.116, 33.483, "Recolha de dados CAPI em zonas rurais e urbanas", "Cobertura activa", false],
    ["Tete", -16.156, 33.587, "Recolha de dados CAPI em zonas de difícil acesso", "Cobertura activa", false],
    ["Zambézia", -17.878, 36.888, "Redes tratadas · acesso fluvial a comunidades ribeirinhas", "100% da amostra prevista", false],
    ["Nampula", -15.116, 39.266, "Grupos focais nas línguas locais · pesquisa qualitativa", "97% taxa de resposta", false],
    ["Niassa", -13.313, 35.240, "Campanha de Quimioprevenção Sazonal da Malária (QSM)", "22.028 entrevistas", false],
    ["Cabo Delgado", -12.973, 40.518, "Recolha de dados em contextos complexos", "Cobertura activa", false]
  ];

  var map = L.map('map', { scrollWheelZoom: false, zoomSnap: 0.25, attributionControl: true });
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors', maxZoom: 18
  }).addTo(map);

  var bounds = [];
  PROVINCES.forEach(function (p) {
    var name = p[0], lat = p[1], lng = p[2], desc = p[3], tag = p[4], hq = p[5];
    bounds.push([lat, lng]);
    L.circleMarker([lat, lng], {
      radius: hq ? 11 : 8, color: '#ffffff', weight: 2,
      fillColor: hq ? '#14559C' : '#1E9E58', fillOpacity: 0.95
    }).addTo(map)
      .bindPopup('<div class="pop-name">' + name + '</div><div class="pop-meta">' + desc + '</div><span class="pop-tag">' + tag + '</span>')
      .bindTooltip(name, { direction: 'right', offset: [10, 0] });
  });

  map.fitBounds(bounds, { padding: [48, 48] });
  map.on('click', function () { map.scrollWheelZoom.disable(); });
  map.getContainer().addEventListener('mouseenter', function () { map.scrollWheelZoom.enable(); });
  map.getContainer().addEventListener('mouseleave', function () { map.scrollWheelZoom.disable(); });
</script>
</body>
</html>
